name: pytensor_ml
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.12
  - pytensor>=3.2.3,<4.0.0
  - numpy
  - safetensors
  - scikit-learn

  # For testing
  - coveralls
  - diff-cover
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-benchmark
  - pytest-mock
  - pyyaml  # tests/test_workflow_groups.py reads the CI matrix

  # For building docs
  - sphinx
  - sphinx_rtd_theme
  - pygments
  - pydot
  - ipython

  # developer tools
  - pre-commit
  - mypy

  # No backend goes here. Each backend's dispatch tests get their own CI job that installs just that
  # one, so the core jobs stay light and prove the library works with no backend present at all.
  - pip
