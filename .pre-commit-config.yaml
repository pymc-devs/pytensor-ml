repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: no-commit-to-branch
        args: [--branch, main]
    -   id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.17
  hooks:
    - id: ruff
      args: [ --fix, --exit-non-zero-on-fix ]
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]

- repo: https://github.com/MarcoGorelli/madforhooks
  rev: 0.4.1
  hooks:
    - id: no-print-statements
      types: [python]
      exclude: |
        (?x)^
        |pytensor_ml/_version.py
    - id: check-execution-order
      args: [--strict]

- repo: local
  hooks:
    - id: pixi-lock-check
      name: pixi.lock is in sync with pyproject.toml
      entry: pixi lock --check
      language: system
      files: ^(pyproject\.toml|pixi\.lock)$
      pass_filenames: false

    - id: pixi-export-dev
      name: conda_envs/pytensor_ml.yml is exported from the pixi dev environment
      # Called directly rather than through a pixi task so the hook reads the manifest only; `pixi run`
      # would re-solve the lock file and install the environment first. --no-pypi drops the editable
      # install, because conda runs pip from the env file's directory, where `-e .` names conda_envs/.
      # -p pins the export to one platform, so it does not depend on the machine running the hook.
      entry: pixi workspace export conda-environment -e dev -n pytensor_ml -p linux-64 --no-pypi conda_envs/pytensor_ml.yml
      language: system
      files: ^(pyproject\.toml|pixi\.lock|conda_envs/pytensor_ml\.yml)$
      pass_filenames: false

    - id: pixi-export-docs
      name: conda_envs/environment-docs.yml is exported from the pixi docs environment
      entry: pixi workspace export conda-environment -e docs -n pytensor_ml-docs -p linux-64 --no-pypi conda_envs/environment-docs.yml
      language: system
      files: ^(pyproject\.toml|pixi\.lock|conda_envs/environment-docs\.yml)$
      pass_filenames: false

    - id: notebook_name
      entry: '\(notebook_name\)='
      language: pygrep
      minimum_pre_commit_version: 2.8.0
      name: Check notebooks do not use literally notebook_name as target
      types: [jupyter]

    - id: no-references-as-links
      name: Check no references that should be sphinx cross-references are urls
      description: >-
        'A quick check to prevent urls pointing to pymc docs or other sphinx built docs like arviz, numpy, scipy...'
      files: ^examples/.+\.ipynb$
      exclude: >
          (?x)(index.md|
               404.md|
               conf.py)
      entry: >
          (?x)(arviz-devs.github.io|
               pymc-extras.readthedocs.io|
               docs.pymc.io|
               numpy.org/doc|
               pymc-examples.readthedocs.io|
               docs.python.org|
               xarray.pydata.org|
               python.arviz.org|
               pytensor.readthedocs.io|
               docs.xarray.dev|
               www.pymc.io|
               docs.scipy.org/doc)
      language: pygrep
      types_or: [markdown, rst, jupyter]
